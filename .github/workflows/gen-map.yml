name: Generate map data
on:
  push:
    branches: [tools-map]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save world-atlas@2 d3-geo@3 topojson-client@3
      - run: node scripts/gen-map.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/data/
          git commit -m "Generate world map data" || exit 0
          git push
